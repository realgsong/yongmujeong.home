<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용무정 소식지 위젯</title>
  <!-- Google Fonts: Noto Sans KR for clean body, Noto Serif KR for traditional headings -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #1b4332; /* Forest Green */
      --accent-color: #c79a3b;  /* Warm Gold */
      --text-color: #2b2d42;    /* Dark Charcoal */
      --bg-color: #fdfbf7;      /* Off-white */
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: transparent; /* Embedded inside iframe */
      color: var(--text-color);
      overflow-x: hidden;
      padding: 10px;
    }

    .widget-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Grid Layout */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 15px;
    }

    /* Post Card */
    .post-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
      text-decoration: none;
      color: inherit;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s forwards;
    }

    .post-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 15px -3px rgba(27, 67, 50, 0.15), 0 4px 6px -2px rgba(27, 67, 50, 0.1);
      border-color: rgba(27, 67, 50, 0.2);
    }

    /* Thumbnail Container */
    .post-thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: var(--primary-color);
      overflow: hidden;
    }

    .post-thumbnail {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .post-card:hover .post-thumbnail {
      transform: scale(1.05);
    }

    /* Card Content */
    .post-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .post-date {
      font-size: 0.8rem;
      color: var(--accent-color);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .post-title {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 10px;
      color: var(--primary-color);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 3.08rem; /* Keeps titles aligned */
    }

    .post-snippet {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 4.05rem; /* Keeps snippet heights aligned */
    }

    .post-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .read-more {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-color);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .read-more::after {
      content: '→';
      transition: transform 0.2s ease;
    }

    .post-card:hover .read-more::after {
      transform: translateX(4px);
    }

    .post-author {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Loader */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
      color: var(--primary-color);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(27, 67, 50, 0.1);
      border-left-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Error Message */
    .error-msg {
      text-align: center;
      padding: 40px 20px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 12px;
      color: #991b1b;
      font-weight: 500;
    }

    /* Default Fallback Archery Graphic */
    .fallback-graphic {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color) 0%, #2d6a4f 100%);
      color: rgba(255, 255, 255, 0.15);
      position: absolute;
      top: 0;
      left: 0;
    }

    .fallback-target {
      width: 80px;
      height: 80px;
      border: 8px solid var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fallback-bullseye {
      width: 30px;
      height: 30px;
      background: var(--accent-color);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Loader -->
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>용무정 소식지를 불러오는 중입니다...</p>
    </div>

    <!-- Error container -->
    <div id="error" style="display: none;">
      <div class="error-msg">소식을 불러오는 데 실패했습니다. 잠시 후 다시 시도해 주세요.</div>
    </div>

    <!-- Grid of posts -->
    <div id="posts-grid" class="posts-grid"></div>
  </div>

  <script>
    // Configuration
    const blogUrl = 'https://blog.xn--v92bn3si5a.org'; // https://blog.용무정.org
    const maxPosts = 6; // Maximum number of posts to display

    // Helper: Strip HTML tags to make clean snippet
    function stripHtml(html) {
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = html;
      return tempDiv.textContent || tempDiv.innerText || "";
    }

    // Helper: Format Date
    function formatDate(dateStr) {
      try {
        const d = new Date(dateStr);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}.${month}.${day}`;
      } catch (e) {
        return dateStr.substring(0, 10).replace(/-/g, '.');
      }
    }

    // Callback function loaded by JSONP
    function renderBloggerWidget(data) {
      const loader = document.getElementById('loader');
      const postsGrid = document.getElementById('posts-grid');
      
      loader.style.display = 'none';

      const entries = data.feed.entry || [];
      if (entries.length === 0) {
        postsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">등록된 소식지가 없습니다.</div>';
        return;
      }

      const limit = Math.min(entries.length, maxPosts);
      let htmlContent = '';

      for (let i = 0; i < limit; i++) {
        const entry = entries[i];
        const title = entry.title.$t;
        const publishedDate = formatDate(entry.published.$t);
        const alternateLink = (entry.link.find(l => l.rel === 'alternate') || {}).href;
        
        // Extract post snippet
        const rawContent = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : "");
        const cleanSnippet = stripHtml(rawContent).trim().substring(0, 120) + '...';
        
        // Extract author
        const authorName = entry.author && entry.author[0] ? entry.author[0].name.$t : '용무정';

        // Helper to get high-resolution Blogger image URLs
        function getHighResImgUrl(url) {
          if (!url) return '';
          let newUrl = url.replace(/\/s[0-9]+(-[a-zA-Z0-9_-]+)?\//g, '/s640/');
          newUrl = newUrl.replace(/=[ws][0-9]+(-[a-zA-Z0-9_-]+)*$/gi, '=s640');
          return newUrl;
        }

        // Extract thumbnail image
        let imgUrl = '';
        if (entry.media$thumbnail) {
          imgUrl = getHighResImgUrl(entry.media$thumbnail.url);
        } else {
          // If no media$thumbnail, search content for <img>
          const imgRegex = /<img[^>]+src="([^">]+)"/g;
          const match = imgRegex.exec(rawContent);
          if (match && match[1]) {
            imgUrl = getHighResImgUrl(match[1]);
          }
        }

        const animationDelay = i * 0.1;

        htmlContent += `
          <a class="post-card" href="${alternateLink}" target="_blank" style="animation-delay: ${animationDelay}s">
            <div class="post-thumbnail-wrapper">
              ${imgUrl ? 
                `<img class="post-thumbnail" src="${imgUrl}" alt="${title}" loading="lazy">` : 
                `<div class="fallback-graphic"><div class="fallback-target"><div class="fallback-bullseye"></div></div></div>`
              }
            </div>
            <div class="post-content">
              <div class="post-date">${publishedDate}</div>
              <h3 class="post-title">${title}</h3>
              <p class="post-snippet">${cleanSnippet}</p>
              <div class="post-footer">
                <span class="post-author">${authorName}</span>
                <span class="read-more">자세히 보기</span>
              </div>
            </div>
          </a>
        `;
      }

      postsGrid.innerHTML = htmlContent;
    }

    // Handle JSONP script loading error
    function handleScriptError() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    // Dynamic JSONP Call
    const script = document.createElement('script');
    script.src = `${blogUrl}/feeds/posts/default?alt=json-in-script&callback=renderBloggerWidget`;
    script.onerror = handleScriptError;
    document.body.appendChild(script);
  </script>
</body>
</html>
